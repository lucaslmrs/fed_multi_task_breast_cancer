<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Árvore de Decisões</title>
<style>
:root{
  --bg:#FFF7F1; --surface:#FFFFFF; --text:#1E1216; --muted:#5b4a4e; --accent:#7B2032;
  --line:#e6d6cf; --fill:#f3e6e0;
  --s-feito:#2f6b4f; --s-decidido:#7B2032; --s-aberto:#a3661a; --s-mantido:#5a5aa0; --s-cortado:#8f8582;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0B0F; --surface:#1E1216; --text:#FFF7F1; --muted:#c9b8b3; --accent:#B83D54;
    --line:#3a272d; --fill:#2a1a1f;
    --s-feito:#5fb08a; --s-decidido:#e0607a; --s-aberto:#e0a24a; --s-mantido:#9a9ae0; --s-cortado:#8f8582;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0B0F; --surface:#1E1216; --text:#FFF7F1; --muted:#c9b8b3; --accent:#B83D54;
  --line:#3a272d; --fill:#2a1a1f;
  --s-feito:#5fb08a; --s-decidido:#e0607a; --s-aberto:#e0a24a; --s-mantido:#9a9ae0; --s-cortado:#8f8582;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1180px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.8rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 18px}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;
  padding:4px 12px;font:inherit;font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="false"]{opacity:.45}
.chip.btn{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.tree{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 10px}
.tree ul{list-style:none;margin:0;padding-left:20px;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border-left:none}
.tree li{margin:2px 0}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:1px solid transparent;
  color:var(--text);font:inherit;padding:4px 6px;border-radius:6px;cursor:pointer}
.node:hover{background:var(--fill)}
.node.sel{border-color:var(--accent);background:var(--fill)}
.tw{width:14px;color:var(--muted);flex:none;font-size:.75rem}
.lbl{flex:1}
.root>.node .lbl{font-weight:700}
li.hidden-status>.node{opacity:.25}
li.collapsed>ul{display:none}
.panel{position:sticky;top:16px;background:var(--surface);border:2px solid var(--accent);border-radius:10px;padding:16px 18px}
.panel h2{margin:0 0 6px;font-size:1.15rem}
.panel .st{font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.panel p{margin:8px 0}
.panel .ev{background:var(--fill);border-radius:6px;padding:8px 10px;font-size:.9rem}
.panel .where{color:var(--muted);font-size:.85rem}
.counts{color:var(--muted);font-size:.85rem;margin-left:auto}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
<h1>Árvore de decisões — FedCHAMP</h1>
<p class="sub">Clique num ramo para ver o detalhe; use os filtros para destacar estados e a seta para recolher um ramo. Registro de 26/10/2026 · <a href="mapa_de_escopo.html">mapa de escopo</a></p>

<div class="toolbar" id="filters">
  <button class="chip btn" id="expand" type="button">Expandir tudo</button>
  <button class="chip btn" id="collapse" type="button">Recolher</button>
  <span class="counts" id="counts"></span>
</div>

<div class="layout">
  <div class="tree" id="tree" role="tree"></div>
  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>
</main>

<script>
const STATUS = {
  feito:    {label:"Feito",     desc:"existe no repositório com resultado"},
  decidido: {label:"Decidido",  desc:"escolha registrada nesta sessão ou em etapa anterior"},
  aberto:   {label:"Em aberto", desc:"precisa de decisão"},
  mantido:  {label:"Mantido",   desc:"implementado, sem resultado; não será descartado"},
  cortado:  {label:"Cortado",   desc:"fora do escopo da dissertação"}
};

const T = {t:"FedCHAMP: mitigar a transferência negativa em FL multi-domínio e multi-tarefa", s:"decidido",
  d:"Pergunta do pré-projeto: corpo-cabeça + agrupamento por protótipos garante que os conhecimentos não se cancelem? Direção mantida (Q1). Prazo: 4–6 meses (Q2). Orientadores cientes; qualificação feita.",
  w:"00_projeto_vs_repositorio.md", c:[
  {t:"1 · O que é transferência negativa", s:"decidido",
   d:"Conceito ampliado (Q8): o federado rende menos que o standalone, por cancelamento (direção) ou por diluição (magnitude). A mitigação precisa endereçar os dois.",
   w:"03_perguntas_abertas.md · Q8", c:[
     {t:"Cancelamento (direção dos updates)", s:"feito",
      d:"Proposto pelo projeto como causa. Medido na E0: cosseno entre deltas de datasets diferentes ≈ 0; razão de cancelamento ≈ referência ortogonal. Há interferência por curvatura com o update inteiro, mas ela é desprezível na escala real da agregação.",
      e:"Z entre datasets: −16 a −22e-4 com Δ inteiro; −0.2 a +0.4e-4 com Δ × wᵢ (≈ aleatório). Uma seed, um holdout.", w:"plano.md E0.3.9"},
     {t:"Diluição (magnitude do passo próprio)", s:"feito",
      d:"Achado da E0: o progresso de cada cliente no próprio objetivo cai ~10× quando o update é escalado pelo peso de agregação, e os outros clientes não compensam. É o custo dominante medido.",
      e:"Self Z: +467/+493 com Δ inteiro → +50/+60 com Δ × wⱼ.", w:"plano.md E0.3.9"},
     {t:"Métrica operacional: lacuna federado − standalone", s:"aberto",
      d:"Q15. Recomendação: lacuna por dataset/tarefa (já medida na E3), decomposta pelo instrumental da E0 em cancelamento e diluição.",
      e:"E3: lacuna média −0.033 (controle) → −0.017 (seed por dataset), 3 seeds, descritivo.", w:"plano.md E3"}
  ]},
  {t:"2 · Etapa 1: desacoplamento corpo-cabeça", s:"feito",
   d:"FedPer: trunk encoder2..5 + bottleneck federado; stem, decoder e cabeças locais.", w:"src/federated/model_split.py", c:[
     {t:"Stem pessoal por modalidade", s:"feito", d:"encoder1 local porque 1 canal (BUSI/SIIM) e 3 canais (ISIC/TCGA) não têm forma comum.", w:"D03"},
     {t:"Seed pessoal por dataset", s:"decidido", d:"Todos os clientes de um dataset começam com o mesmo stem e cabeças. Único braço da E3 que melhora as 8 células e cria alinhamento intra-dataset (M1 0.098 vs 0.003). Também é um mitigador de diluição: alinha os updates de um mesmo dataset.", w:"D26"},
     {t:"Backbone", s:"decidido", d:"MTnnUNet (U-Net com InstanceNorm).", c:[
       {t:"MTnnUNet", s:"feito", d:"Backbone de todos os resultados atuais."},
       {t:"ResNet-34 ImageNet (E7)", s:"mantido", d:"Implementado em worktree, 400 rodadas, sem resultado. Pode ser o único ponto da 'escolha de backbone' do projeto.", w:"plano.md E7"},
       {t:"Varredura YOLO / VGG / MobileNet / ViT / Swin", s:"cortado", d:"Cortado em 26/10 (Q11). Prevista no pré-projeto; inviável no prazo e ortogonal à pergunta."}
     ]},
     {t:"Quanto compartilhar", s:"aberto", d:"Q16: E6 fica como hipótese de mitigação (compartilhar mais = mais transferência, possivelmente mais diluição).", c:[
       {t:"Trunk encoder2..bottleneck", s:"feito", d:"Configuração atual."},
       {t:"Decoder federado (E6)", s:"mantido", d:"Implementado (federated.shared_modules), sem resultado.", w:"plano.md E6"}
     ]}
  ]},
  {t:"3 · Etapa 2: mecanismo de mitigação", s:"aberto",
   d:"Nada será implementado nesta fase (Q9). Ramo central para a próxima conversa com os orientadores.", c:[
     {t:"Agrupamento por dataset (cluster oráculo)", s:"feito",
      d:"Agregação hierárquica: normaliza dentro do dataset, depois dataset_weights. É o limite superior do que um agrupamento aprendido poderia recuperar.",
      e:"Impor a hierarquia: BUSI Dice +0.016, ISIC cls acc −0.046.", w:"D04 · server.py::_hierarchical_weights"},
     {t:"Agrupamento por protótipos", s:"aberto",
      d:"Peça central do título, ainda inexistente. Versão mínima sugerida: protótipo por classe = média do bottleneck; cosseno; agrupamento aglomerativo; agregação intra-cluster e depois global. Q17: o cluster oráculo basta ou os protótipos são obrigatórios?"},
     {t:"Resolução de conflito na fase global", s:"aberto",
      d:"Projeção ortogonal (PCGrad-like) ou ponderação por variância, como no pré-projeto. Com a E0 mostrando updates ortogonais entre datasets, o ganho esperado é pequeno."},
     {t:"Mitigação da diluição", s:"aberto",
      d:"Ramo novo, consequência do conceito ampliado (Q14). Os protótipos decidem com quem agregar, mas não devolvem magnitude ao passo próprio.",
      c:[
        {t:"Peso maior para o próprio cluster na fase global", s:"aberto", d:"Candidato direto contra a diluição."},
        {t:"Trunk por cluster", s:"aberto", d:"Reduz a diluição, mas aproxima do MAS (fragmenta o modelo único)."},
        {t:"Seed por dataset", s:"decidido", d:"Já adotada; alinha os updates no início e reduz o cancelamento intra-dataset."}
     ]}
  ]},
  {t:"4 · Cenário experimental", s:"decidido", c:[
     {t:"Datasets", s:"decidido", c:[
       {t:"BUSI · ISIC 2018 · TCGA-LGG · SIIM-ACR", s:"feito", d:"Pré-processados e no master. BUSI não estava na lista do projeto, mas 'ultrassom' está nos domínios."},
       {t:"PANDA (histopatologia)", s:"cortado", d:"Cortado em 26/10 (Q11)."}
     ]},
     {t:"Tarefas", s:"decidido", c:[
       {t:"Segmentação + classificação", s:"feito", d:"Com supervisão parcial (has_mask / has_label)."},
       {t:"Detecção", s:"cortado", d:"Cortada em 26/10 (Q11), junto com o PANDA."}
     ]},
     {t:"Topologia de clientes", s:"feito", d:"single_task (histórica) e multi_task / HC-FMTL (sem duplicar imagens entre silos). Entra como decisão de configuração justificada.", w:"D13"},
     {t:"Loss (E3)", s:"decidido", d:"DiceBCE com Batch Dice; CE balanced_fold; λ 4:1. Kendall, λ 1:1 e agregação 1:1 rejeitados.", w:"plano.md E3"},
     {t:"Resolução por dataset (E4)", s:"mantido", d:"TCGA e SIIM a 256 px. Implementado, sem resultado. Relevante para a seg do SIIM, que quase não aprende a 128 px.", w:"plano.md E4"},
     {t:"Clientes few-shot sintéticos", s:"aberto", d:"Previstos no projeto para H3; hoje só há a escassez natural do BUSI."},
     {t:"Orçamento local (steps vs epochs)", s:"decidido", d:"Só comparar braços com o mesmo modo. 400 rodadas a partir da E6/E7 (D15: todos sub-treinados a 200)."}
  ]},
  {t:"5 · Baselines", s:"aberto", d:"Q10.", c:[
     {t:"Standalone", s:"feito", d:"federated.standalone: True, mesmo pipeline e mesma partição."},
     {t:"FedAvg (agregação ingênua)", s:"feito", d:"Modo flat (braço ablation_flat)."},
     {t:"FedMTL", s:"aberto", d:"Recomendado primeiro: é o mais próximo do FedCHAMP (corpo-cabeça + similaridade de cabeças). Artigo em referencies/."},
     {t:"MAS", s:"aberto", d:"Não cortado (26/10). Artigo em referencies/."},
     {t:"Centralizado", s:"feito", d:"Só válido no estudo BUSI; ISIC não tem máscara e rótulo na mesma imagem."}
  ]},
  {t:"6 · Hipóteses e avaliação", s:"aberto", c:[
     {t:"H1 · sem cancelamento", s:"feito", d:"Instrumental pronto (cosseno, cancelamento, M1, M2 com controle nulo). Com o conceito ampliado, H1 passa a separar cancelamento de diluição.", w:"docs/GRADIENT_CONFLICT_METHODS.md"},
     {t:"H2 · convergência mais rápida", s:"aberto", d:"Curvas existem (monitor); falta a comparação 'rodadas até X' entre braços."},
     {t:"H3 · supera standalone com poucos dados", s:"feito", d:"Medido; hoje desfavorável, exceto no BUSI (0.60–0.66 vs 0.47–0.51 de balanced acc).", w:"plano.md B0"},
     {t:"Inferência", s:"decidido", d:"Tudo descritivo (1 ou 3 seeds); p-valores só exploratórios; nunca 'estatisticamente significativo'. Perfil final (3 seeds) disponível."}
  ]},
  {t:"7 · Produtos", s:"decidido", c:[
     {t:"Paper CIARP 2026 (FedPer em BUSI)", s:"feito", d:"Entra na dissertação como resultado preliminar da Etapa 1.", w:"papers/ciarp2026"},
     {t:"Dissertação", s:"aberto", d:"4–6 meses."}
  ]}
]};

let uid = 0;
const index = {};
function build(node, parentUl){
  const id = "n" + (uid++); node.id = id; index[id] = node;
  const li = document.createElement("li");
  li.dataset.status = node.s; li.setAttribute("role","treeitem");
  const btn = document.createElement("button");
  btn.type = "button"; btn.className = "node"; btn.dataset.id = id;
  const tw = document.createElement("span"); tw.className = "tw"; tw.textContent = node.c ? "▾" : "";
  const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = `var(--s-${node.s})`;
  dot.title = STATUS[node.s].label;
  const lbl = document.createElement("span"); lbl.className = "lbl"; lbl.textContent = node.t;
  btn.append(tw, dot, lbl); li.append(btn);
  if (node.c){
    li.setAttribute("aria-expanded","true");
    const ul = document.createElement("ul"); ul.setAttribute("role","group");
    node.c.forEach(ch => build(ch, ul)); li.append(ul);
  }
  parentUl.append(li);
  return li;
}
const rootUl = document.createElement("ul");
const rootLi = build(T, rootUl); rootLi.classList.add("root");
document.getElementById("tree").append(rootUl);

const panel = document.getElementById("panel");
function show(id){
  const n = index[id];
  document.querySelectorAll(".node.sel").forEach(b => b.classList.remove("sel"));
  document.querySelector(`.node[data-id="${id}"]`).classList.add("sel");
  panel.innerHTML = "";
  const st = document.createElement("div"); st.className = "st"; st.style.color = `var(--s-${n.s})`;
  st.textContent = `${STATUS[n.s].label} · ${STATUS[n.s].desc}`;
  const h = document.createElement("h2"); h.textContent = n.t;
  panel.append(st, h);
  if (n.d){ const p = document.createElement("p"); p.textContent = n.d; panel.append(p); }
  if (n.e){ const p = document.createElement("p"); p.className = "ev"; p.textContent = "Evidência: " + n.e; panel.append(p); }
  if (n.w){ const p = document.createElement("p"); p.className = "where"; p.textContent = "Onde: " + n.w; panel.append(p); }
  if (n.c){ const p = document.createElement("p"); p.className = "where"; p.textContent = `${n.c.length} sub-ramo(s).`; panel.append(p); }
}
document.getElementById("tree").addEventListener("click", e => {
  const btn = e.target.closest(".node"); if (!btn) return;
  const li = btn.parentElement;
  if (e.target.classList.contains("tw") && li.querySelector(":scope>ul")){
    li.classList.toggle("collapsed");
    li.setAttribute("aria-expanded", li.classList.contains("collapsed") ? "false" : "true");
    btn.querySelector(".tw").textContent = li.classList.contains("collapsed") ? "▸" : "▾";
    return;
  }
  show(btn.dataset.id);
});
function setAll(collapsed){
  document.querySelectorAll("#tree li").forEach(li => {
    if (!li.querySelector(":scope>ul") || li.classList.contains("root")) return;
    li.classList.toggle("collapsed", collapsed);
    li.querySelector(":scope>.node .tw").textContent = collapsed ? "▸" : "▾";
  });
}
document.getElementById("expand").onclick = () => setAll(false);
document.getElementById("collapse").onclick = () => setAll(true);

const active = new Set(Object.keys(STATUS));
const counts = {}; Object.values(index).forEach(n => counts[n.s] = (counts[n.s]||0) + 1);
const bar = document.getElementById("filters");
const countsEl = document.getElementById("counts");
Object.entries(STATUS).forEach(([k,v]) => {
  const b = document.createElement("button");
  b.type = "button"; b.className = "chip"; b.setAttribute("aria-pressed","true");
  b.innerHTML = `<span class="dot" style="background:var(--s-${k})"></span>${v.label} (${counts[k]||0})`;
  b.onclick = () => {
    if (active.has(k)) active.delete(k); else active.add(k);
    b.setAttribute("aria-pressed", active.has(k));
    document.querySelectorAll("#tree li").forEach(li => li.classList.toggle("hidden-status", !active.has(li.dataset.status)));
  };
  bar.insertBefore(b, countsEl);
});
countsEl.textContent = `${Object.keys(index).length} ramos`;
show(T.id);
</script>
</body>
</html>
