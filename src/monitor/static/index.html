<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Monitor</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.2/plotly.min.js"
        onerror="this.remove();var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js';s.onerror=function(){window.PLOTLY_FAILED=true;};document.head.appendChild(s);"></script>
</head>
<body>
<header class="topbar">
  <h1>Training Monitor</h1>
  <span id="root-label" class="muted"></span>
  <span class="spacer"></span>
  <span id="live-indicator" class="live hidden" title="Atualização periódica ligada">● ao vivo</span>
  <button id="compare-button" class="primary" disabled>Comparar (0)</button>
  <button id="help-button" title="Como ler o monitor">? Legenda</button>
  <button id="theme-button" title="Alternar tema">◐</button>
</header>
<div id="plotly-warning" class="banner critical hidden">
  Plotly.js não carregou (sem acesso ao CDN): tabelas funcionam, gráficos não.
</div>
<section id="glossary" class="glossary-panel hidden"></section>
<div class="layout">
  <aside class="sidebar">
    <input id="filter" type="search" placeholder="Filtrar runs, braços, datasets…">
    <div class="legend muted">
      <span class="pill running">running</span><span class="pill stale">stale</span>
      <span class="pill pending">pending</span><span class="pill complete">complete</span>
    </div>
    <div id="run-tree"></div>
  </aside>
  <main id="main">
    <section class="empty-state">
      <h2>Selecione um run</h2>
      <p class="muted">Clique em um run para ver curvas, agregação, conflito, recursos e o
        diagnóstico da E1. Marque dois ou mais para comparar.</p>
    </section>
  </main>
</div>
<script src="/static/app.js"></script>
</body>
</html>
